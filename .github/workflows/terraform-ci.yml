name: terraform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # upload Checkov SARIF to code scanning

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --format compact

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov (policy-as-code)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          # Start soft; review the first run, record accepted risks as inline
          # #checkov:skip comments with justification, then set to false.
          soft_fail: true

      # Code scanning upload needs GitHub Advanced Security on private repos.
      # Without it this step fails; continue-on-error keeps the job green and
      # the SARIF is still saved as a downloadable artifact below.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Save Checkov results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: results.sarif
          if-no-files-found: ignore
